[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-fw"
version = "0.1.0"
description = "Defensive, bounded Linux firewall agent with optional advisory AI"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
aegis-fw = "aegis_fw.cli:main"
aegis-fw-admin = "aegis_fw.admin:main"

[tool.setuptools.packages.find]
include = ["aegis_fw*"]
